# CZD Purple GRUB theme (czd-boot-theme). Named zz- so it sources after kali-themes.cfg. Removing the package removes this file and
# update-grub returns to the distribution default.
GRUB_THEME=/usr/share/grub/themes/czd-purple/theme.txt
GRUB_GFXMODE=1920x1080,1280x720,auto
GRUB_GFXPAYLOAD_LINUX=keep
GRUB_TIMEOUT=8
GRUB_TIMEOUT_STYLE=menu
GRUB_DISABLE_OS_PROBER=false
