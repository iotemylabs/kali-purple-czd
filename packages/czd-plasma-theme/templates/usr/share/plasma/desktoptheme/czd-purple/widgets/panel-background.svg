<?xml version="1.0" encoding="UTF-8"?>
<!-- CZD Purple panel (batch 04): surface.raised, one 1px gold 26% hairline along the top,
     nothing else. No float, no rounding, no translucency, no shadow.
     Rendered from tokens by tokens/generate.py; this file is a template. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- 9-slice: 8px corners, stretched edges. The hairline lives in the top row only. -->
  <rect id="topleft"     x="0"  y="0"  width="8"  height="8"  fill="{{ surface.raised }}"/>
  <rect id="top"         x="8"  y="0"  width="48" height="8"  fill="{{ surface.raised }}"/>
  <rect id="topright"    x="56" y="0"  width="8"  height="8"  fill="{{ surface.raised }}"/>
