# CZD Purple · isolinux menu (BIOS mode). Gold on near-black; the 640×480 splash is the boot
# plate. Colours are syslinux AARRGGBB, rendered from tokens by tokens/generate.py (template).
menu background splash.png
menu color title        * #FF{{ text.primary | nohash }} *
menu color border       * #00000000 #00000000 none
menu color sel          * #FF{{ surface.base | nohash }} #FF{{ trace.gold | nohash }} none
menu color hotsel       1;7;37;40 #FF{{ surface.base | nohash }} #FF{{ trace.gold | nohash }} none
menu color unsel        * #FF{{ text.secondary | nohash }} #00000000 none
menu color hotkey       * #FF{{ trace.gold | nohash }} #00000000 none
menu color tabmsg       * #FF{{ text.secondary | nohash }} #00000000 *
menu color help         37;40 #FF{{ text.secondary | nohash }} #00000000 none
menu color timeout_msg  * #FF{{ trace.gold | nohash }} #00000000 none
menu color timeout      * #FF{{ trace.gold | nohash }} #00000000 none
menu color cmdline      * #FF{{ text.primary | nohash }} #00000000 none
menu vshift 10
menu hshift 4
menu width 70
menu margin 5
menu rows 10
menu helpmsgrow 15
menu cmdlinerow 16
menu timeoutrow 16
menu tabmsgrow 18
menu tabmsg ENTER BOOT · TAB EDIT
