label live-czd-failsafe
        menu label FAILSAFE  Live, fail-safe mode
        linux @LINUX@
        initrd @INITRD@
        append @APPEND_LIVE_FAILSAFE@ username=czd hostname=czd-purple

label live-czd-forensic
        menu label FORENSIC  Live, forensic mode · no swap, no automount
        linux @LINUX@
        initrd @INITRD@
        append @APPEND_LIVE@ username=czd hostname=czd-purple noswap noautomount

label live-czd-persist-plain
        menu label PERSIST   Live with unencrypted persistence · label czd-persistence
        linux @LINUX@
        initrd @INITRD@
        append @APPEND_LIVE@ username=czd hostname=czd-purple persistence persistence-label=czd-persistence
