# CZD Purple live image (UEFI boot). Batch 03, grub-menu: GFXMODE 1920×1080, 8 s timeout,
# no beep in a lecture hall.
set default=0
set timeout=8
set timeout_style=menu

loadfont $prefix/unicode.pf2
set gfxmode=1920x1080,1280x720,auto
set gfxpayload=keep
insmod all_video
insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm
