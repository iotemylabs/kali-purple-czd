# CZD Purple live image (UEFI boot). Batch 03, grub-menu: GFXMODE 1920×1080, 8 s timeout,
# no beep in a lecture hall.
set default=0
set timeout=8
set timeout_style=menu

loadfont $prefix/unicode.pf2
# Theme fonts are matched by name against fonts already loaded; update-grub does this for the
# installed system, the live image has to do it here (build.sh stages the PF2s into theme/).
for f in czd-ui-40 czd-mono-30 czd-mono-24 czd-mono-26; do
        if [ -f $prefix/theme/$f.pf2 ]; then loadfont $prefix/theme/$f.pf2; fi
done
set gfxmode=1920x1080,1280x720,auto
set gfxpayload=keep
insmod all_video
insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm
