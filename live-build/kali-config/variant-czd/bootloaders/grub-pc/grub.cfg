# CZD Purple live image (UEFI boot) — the rows from the grub-menu plate.
# GRUB items are one line, so the token column and the subtitle fold into the title.
# @KERNEL_LIVE@ / @APPEND_LIVE@ / @INITRD_LIVE@ are filled by live-build (binary_grub_cfg).
source /boot/grub/config.cfg

menuentry "LIVE      CZD Purple live · Plasma 6 · nothing written to disk · login czd / czd" --hotkey=l {
        linux   @KERNEL_LIVE@ @APPEND_LIVE@ username=czd hostname=czd-purple
        initrd  @INITRD_LIVE@
}
menuentry "PERSIST   Live with encrypted persistence · LUKS prompt at boot · label czd-persistence" --hotkey=p {
        linux   @KERNEL_LIVE@ @APPEND_LIVE@ username=czd hostname=czd-purple persistence persistent=cryptsetup persistence-encryption=luks persistence-label=czd-persistence
        initrd  @INITRD_LIVE@
}
menuentry "INSTALL   Install CZD Purple · Calamares · erases the target disk" --hotkey=i {
        linux   @KERNEL_LIVE@ @APPEND_LIVE@ username=czd hostname=czd-purple czd.install=1
        initrd  @INITRD_LIVE@
}

submenu "ADVANCED  Advanced options · failsafe · forensic mode · memtest86+" --hotkey=a {
        source /boot/grub/theme.cfg

        menuentry "FAILSAFE  Live, fail-safe mode · no splash, no acpi, no modeset" {
                linux   @KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@ username=czd hostname=czd-purple
                initrd  @INITRD_LIVE@
        }
        menuentry "FORENSIC  Live, forensic mode · no swap, no automount" {
                linux   @KERNEL_LIVE@ @APPEND_LIVE@ username=czd hostname=czd-purple noswap noautomount
                initrd  @INITRD_LIVE@
        }
        menuentry "PERSIST   Live with unencrypted persistence · label czd-persistence" {
                linux   @KERNEL_LIVE@ @APPEND_LIVE@ username=czd hostname=czd-purple persistence persistence-label=czd-persistence
                initrd  @INITRD_LIVE@
        }
        menuentry "VERIFY    Verify the boot medium · checksums" {
                linux   @KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
                initrd  @INITRD_LIVE@
        }

        # debian-installer, the text/graphical installer Kali ships, for people who need it
        if @ENABLE_INSTALL_MENU@; then
                source /boot/grub/install.cfg
        fi

        # memtest86+ (if any)
        if @ENABLE_MEMTEST@; then
                source /boot/grub/memtest.cfg
        fi
}

if [ "${grub_platform}" = "efi" ]; then
        menuentry "FIRMWARE  UEFI firmware settings · reboots into the vendor menu" --hotkey=f {
                fwsetup
        }
fi
