# Live-only packages leave the installed system. The eight czd-* packages stay: removing them
# is the user's call (apt purge 'czd-*'), never the installer's.
---
backend: apt
operations:
  - remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'live-task-localisation'
      - 'live-task-recommended'
      - 'calamares'
      - 'calamares-settings-debian'
