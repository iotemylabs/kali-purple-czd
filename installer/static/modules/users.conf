# Batch 08, step 05 USER. Root stays disabled (sudo works). The live session is czd/czd and
# says so on the GRUB row; the installed user is a real one with a real password.
---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
    - wireshark
    - kismet
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false
doReusePassword: true
allowWeakPasswords: false
allowWeakPasswordsDefault: false
passwordRequirements:
    nonempty: true
    minLength: 8
    maxLength: -1
setHostname: EtcFile
writeHostsFile: true
