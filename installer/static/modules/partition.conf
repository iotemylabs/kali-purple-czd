# Batch 08, calamares-partitions: erase-and-encrypt is the default and the one CZD tests;
# manual is one click away. LUKS2, ext4 inside, /boot unencrypted so GRUB can theme itself
# (Calamares splits /boot out automatically when the system partition is encrypted).
---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    512MiB
    minimumSize:        64MiB
    label:              "EFI"
userSwapChoices:
    - none
    - small
    - suspend
    - file
initialSwapChoice: small
luksGeneration: luks2
enableLuksAutomatedPartitioning: true
drawNestedPartitions:   false
alwaysShowPartitionLabels: true
initialPartitioningChoice: erase
defaultFileSystemType:  "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]
essentialMounts: [ "live-*", "control", "ventoy" ]
lvm:
    enable: false
